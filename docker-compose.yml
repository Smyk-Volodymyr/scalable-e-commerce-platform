name: ecommerce

services:
  # ---------- Сховища ----------
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: user_service
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d user_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  product-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: product_service
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d product_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  order-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: order_service
    ports:
      - "5435:5432"
    volumes:
      - order-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d order_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: payment_service
    ports:
      - "5436:5432"
    volumes:
      - payment-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d payment_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  cart-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    # Порт назовні потрібен інтеграційним тестам cart-service:
    # вони працюють з реальним Redis, а не з мок-клієнтом.
    ports:
      - "6380:6379"
    volumes:
      - cart-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------- Сервіси ----------
  user-service:
    build: ./user-service
    restart: unless-stopped
    healthcheck:
      # Стукаємо у власний /health вбудованим у Node fetch. Ставити curl чи wget
      # в образ заради одного GET-запиту — зайвий шар і зайва поверхня атаки.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на накат міграцій і підключення до RabbitMQ при холодному старті.
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://shop:shop@user-db:5432/user_service
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      BCRYPT_ROUNDS: 12
      REFRESH_TTL_DAYS: 30
    depends_on:
      user-db:
        condition: service_healthy

  product-service:
    build: ./product-service
    restart: unless-stopped
    healthcheck:
      # Стукаємо у власний /health вбудованим у Node fetch. Ставити curl чи wget
      # в образ заради одного GET-запиту — зайвий шар і зайва поверхня атаки.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на накат міграцій і підключення до RabbitMQ при холодному старті.
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgres://shop:shop@product-db:5432/product_service
      JWT_SECRET: ${JWT_SECRET}
      RESERVATION_TTL_MINUTES: 15
      RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  cart-service:
    build: ./cart-service
    restart: unless-stopped
    healthcheck:
      # Стукаємо у власний /health вбудованим у Node fetch. Ставити curl чи wget
      # в образ заради одного GET-запиту — зайвий шар і зайва поверхня атаки.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на накат міграцій і підключення до RabbitMQ при холодному старті.
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://cart-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_TTL_DAYS: 30
    depends_on:
      cart-redis:
        condition: service_healthy

  order-service:
    build: ./order-service
    restart: unless-stopped
    healthcheck:
      # Стукаємо у власний /health вбудованим у Node fetch. Ставити curl чи wget
      # в образ заради одного GET-запиту — зайвий шар і зайва поверхня атаки.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на накат міграцій і підключення до RabbitMQ при холодному старті.
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3004
      DATABASE_URL: postgres://shop:shop@order-db:5432/order_service
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  payment-service:
    build: ./payment-service
    restart: unless-stopped
    healthcheck:
      # Стукаємо у власний /health вбудованим у Node fetch. Ставити curl чи wget
      # в образ заради одного GET-запиту — зайвий шар і зайва поверхня атаки.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на накат міграцій і підключення до RabbitMQ при холодному старті.
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3005
      DATABASE_URL: postgres://shop:shop@payment-db:5432/payment_service
      JWT_SECRET: ${JWT_SECRET}
      ORDER_SERVICE_URL: http://order-service:3004
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    depends_on:
      payment-db:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: notification_service
    ports:
      - "5437:5432"
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d notification_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  notification-service:
    build: ./notification-service
    restart: unless-stopped
    healthcheck:
      # Стукаємо у власний /health вбудованим у Node fetch. Ставити curl чи wget
      # в образ заради одного GET-запиту — зайвий шар і зайва поверхня атаки.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3006/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на накат міграцій і підключення до RabbitMQ при холодному старті.
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3006
      DATABASE_URL: postgres://shop:shop@notification-db:5432/notification_service
      RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672
    depends_on:
      notification-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy  

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    healthcheck:
      # Стукаємо у власний /health вбудованим у Node fetch. Ставити curl чи wget
      # в образ заради одного GET-запиту — зайвий шар і зайва поверхня атаки.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Запас на накат міграцій і підключення до RabbitMQ при холодному старті.
      start_period: 20s
    environment:
      NODE_ENV: production
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_SERVICE_URL: http://cart-service:3003
      ORDER_SERVICE_URL: http://order-service:3004
      PAYMENT_SERVICE_URL: http://payment-service:3005
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service

volumes:
  user-db-data:
  product-db-data:
  order-db-data:
  payment-db-data:
  cart-redis-data:
  notification-db-data:
  rabbitmq-data: