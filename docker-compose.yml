name: ecommerce

services:
  user-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: user_service
    ports:
      - "5433:5432"
    volumes:
      - user-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d user_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  product-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: product_service
    ports:
      - "5434:5432"
    volumes:
      - product-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d product_service"]
      interval: 5s
      timeout: 3s
      retries: 5

  user-service:
    build: ./user-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://shop:shop@user-db:5432/user_service
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 15m
      BCRYPT_ROUNDS: 12
      REFRESH_TTL_DAYS: 30
    depends_on:
      user-db:
        condition: service_healthy

  product-service:
    build: ./product-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
      DATABASE_URL: postgres://shop:shop@product-db:5432/product_service
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      product-db:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      USER_SERVICE_URL: http://user-service:3001
      PRODUCT_SERVICE_URL: http://product-service:3002
      CORS_ORIGIN: http://localhost:5173
      CART_SERVICE_URL: http://cart-service:3003
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - product-service
  
  cart-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - cart-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cart-service:
    build: ./cart-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003
      REDIS_URL: redis://cart-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PRODUCT_SERVICE_URL: http://product-service:3002
      CART_TTL_DAYS: 30
    depends_on:
      cart-redis:
        condition: service_healthy
  
volumes:
  user-db-data:
  product-db-data:
  cart-redis-data: